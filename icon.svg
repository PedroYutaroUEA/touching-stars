<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeb3b" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Alien Gradient -->
    <linearGradient id="alienGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="248" height="248" x="4" y="4" rx="52" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Background Tiny Stars -->
  <circle cx="48" cy="56" r="2" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="196" cy="42" r="2.5" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="218" cy="112" r="1.5" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="36" cy="180" r="2" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="82" cy="36" r="1.5" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="120" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>

  <!-- Golden Goal Star / Comet (Top Right) -->
  <circle cx="178" cy="78" r="46" fill="url(#starGlow)"/>

  <!-- Star Rays -->
  <path d="M 178,38 Q 178,78 218,78 Q 178,78 178,118 Q 178,78 138,78 Q 178,78 178,38 Z" fill="#fef08a"/>
  <!-- Secondary diagonal spark -->
  <path d="M 178,54 Q 178,78 202,78 Q 178,78 178,102 Q 178,78 154,78 Q 178,78 178,54 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Platform Under Alien -->
  <rect x="34" y="206" width="130" height="22" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="42" y="206" width="114" height="4" fill="#64748b"/>

  <!-- Alien Character (Jumping / Reaching towards Star) -->
  <g transform="translate(68, 108)">
    <!-- Alien Body -->
    <rect x="0" y="0" width="68" height="68" rx="16" fill="url(#alienGrad)" stroke="#15803d" stroke-width="3"/>
    
    <!-- Eyes -->
    <rect x="14" y="16" width="16" height="18" rx="4" fill="#ffffff"/>
    <rect x="38" y="16" width="16" height="18" rx="4" fill="#ffffff"/>
    
    <!-- Pupils (Looking up towards the star) -->
    <rect x="20" y="18" width="8" height="10" rx="2" fill="#0f172a"/>
    <rect x="44" y="18" width="8" height="10" rx="2" fill="#0f172a"/>
    <!-- Eye Highlights -->
    <circle cx="26" cy="21" r="2" fill="#ffffff"/>
    <circle cx="50" cy="21" r="2" fill="#ffffff"/>

    <!-- Reaching Hand/Arm towards the Star -->
    <rect x="58" y="2" width="18" height="10" rx="5" transform="rotate(-35 58 2)" fill="#4ade80" stroke="#15803d" stroke-width="2"/>

    <!-- Cheerful blush -->
    <ellipse cx="14" cy="42" rx="5" ry="3" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="54" cy="42" rx="5" ry="3" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- Sparkle Particle next to Hand -->
  <polygon points="152,106 155,114 163,117 155,120 152,128 149,120 141,117 149,114" fill="#fef08a" opacity="0.95"/>
</svg>
