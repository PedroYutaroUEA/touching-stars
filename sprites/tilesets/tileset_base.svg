<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Fundo rochoso/árido (Estilo solo marciano) -->
  <rect width="48" height="48" fill="#AF6B3D"/>
  
  <!-- Linhas de Grade Internas (Ajudam a separar os 9 tiles no Godot) -->
  <path d="M16 0 v48 M32 0 v48 M0 16 h48 M0 32 h48" stroke="#8A5029" stroke-width="1"/>
  
  <!-- Borda Externa Clara (Realça as quinas das plataformas) -->
  <rect x="1" y="1" width="46" height="46" fill="none" stroke="#D49A73" stroke-width="2"/>
  
  <!-- Rachaduras e fendas no solo -->
