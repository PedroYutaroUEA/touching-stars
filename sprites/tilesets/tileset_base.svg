  <!-- Pedras pontiagudas -->
  <polygon points="10,12 14,10 13,14" fill="#5E3316"/>
  <polygon points="28,8 30,5 32,7" fill="#5E3316"/>
  <polygon points="6,28 9,26 8,30" fill="#5E3316"/>
  <polygon points="34,26 38,24 37,28" fill="#5E3316"/>
  <polygon points="12,38 16,36 15,40" fill="#5E3316"/>
