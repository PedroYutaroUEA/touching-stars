<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect width="16" height="16" fill="none"/>
  <!-- Metade Esquerda (Reflexo da luz) -->
  <polygon points="8,2 8,16 2,16" fill="#E0E0E0"/>
  <!-- Metade Direita (Sombra) -->
  <polygon points="8,2 14,16 8,16" fill="#9E9E9E"/>
  <!-- Chanfro na base para dar peso ao metal -->
  <polygon points="2,16 14,16 8,14" fill="#616161"/>
</svg>
