<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Base ligeiramente escurecida -->
  <rect width="16" height="16" fill="#37474F"/>
  <!-- Grade de chapas (alinha-se com as linhas do corner e surface) -->
  <line x1="0" y1="8" x2="16" y2="8" stroke="#263238" stroke-width="1"/>
  <line x1="8" y1="0" x2="8" y2="16" stroke="#263238" stroke-width="1"/>
  <!-- Sombreamento sutil nos cantos dos painéis para dar textura -->
  <rect x="1" y="1" width="6" height="6" fill="#455A64" opacity="0.4"/>
  <rect x="9" y="9" width="6" height="6" fill="#455A64" opacity="0.4"/>
</svg>
